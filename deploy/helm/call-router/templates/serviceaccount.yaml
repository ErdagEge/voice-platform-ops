{{- if .Values.serviceAccount.create }}
# The identity pods run as. A dedicated account (instead of "default") lets us
# attach exactly the permissions needed later - e.g. GKE Workload Identity.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "call-router.serviceAccountName" . }}
  labels:
    {{- include "call-router.labels" . | nindent 4 }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
{{- end }}
