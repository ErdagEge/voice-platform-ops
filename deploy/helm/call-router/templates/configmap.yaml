# A ConfigMap holds non-secret configuration. The Deployment loads every key
# below as an environment variable (envFrom), which config/runtime.exs reads.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "call-router.fullname" . }}
  labels:
    {{- include "call-router.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.config.port | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  # The Erlang VM sizes its port table from the open-file limit. Some
  # container runtimes set that limit to ~1 billion, which makes the VM
  # allocate huge tables at boot and get OOMKilled. Cap it explicitly.
  ERL_MAX_PORTS: {{ .Values.config.erlMaxPorts | quote }}
