# Default (production-leaning) values. Override per environment with
# `-f values-<env>.yaml` or `--set key=value`.

replicaCount: 2

image:
  repository: voice-platform-ops/call_router
  tag: ""            # empty = use Chart.appVersion
  pullPolicy: IfNotPresent

# App configuration, delivered via a ConfigMap as environment variables.
config:
  port: 4000
  logLevel: info
  # Cap Erlang port table (see configmap.yaml) to avoid OOM at startup.
  erlMaxPorts: 65536
  # Name of the environment, attached to traces (deployment.environment).
  environment: local
  # Fault injection for demos/chaos tests. Keep 0 outside experiments!
  faultErrorRate: "0"
  faultLatencyMs: 0

# OpenTelemetry tracing. Empty endpoint = tracing export disabled (no-op).
tracing:
  otlpEndpoint: ""   # e.g. http://alloy.monitoring:4318

serviceAccount:
  create: true
  name: ""           # empty = generated from release name
  automountToken: false   # the app never talks to the K8s API

service:
  type: ClusterIP    # internal only; values-local.yaml switches to NodePort
  port: 80           # port other pods use to reach the Service
  nodePort: null     # only used when type=NodePort

# Requests = what the scheduler reserves; limits = hard cap.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    path: /readyz
    initialDelaySeconds: 2
    periodSeconds: 5
    failureThreshold: 2

# Graceful shutdown: sleep in preStop so Service endpoints drop this pod
# before the app receives SIGTERM, then allow time to finish requests.
preStopSleepSeconds: 5
terminationGracePeriodSeconds: 30

podDisruptionBudget:
  enabled: true
  minAvailable: 1

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# Prometheus scrape annotations (for annotation-based discovery).
metrics:
  scrape: true
  path: /metrics

# ServiceMonitor for the Prometheus Operator (kube-prometheus-stack).
# Needs the monitoring.coreos.com CRDs, so it's off by default.
serviceMonitor:
  enabled: false
  interval: 15s
  scrapeTimeout: 10s
  labels: {}

# Ship the Grafana dashboard as a ConfigMap (loaded by Grafana's sidecar).
grafanaDashboard:
  enabled: false

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Pod spreading (see deployment.yaml). Hard across nodes, soft across zones
# (GKE regional clusters have 3 zones; kind has none, so it is a no-op there).
topologySpread:
  - topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
  - topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway

# PostgreSQL. enabled=false -> no DATABASE_URL -> calls stay in pod memory
# (only useful for a quick demo). The Secret must contain a full URL
# (postgres://user:pass@host:5432/db) under `secretKey`.
database:
  enabled: true
  secretName: call-router-db-app # created by CloudNativePG (deploy/helm/call-router-db)
  secretKey: uri
  poolSize: 5
  # CNPG's uri host is "<service>.<namespace>". Append this domain so the
  # process resolves the Service on the first DNS query, and lower ndots
  # (see deployment.yaml). Empty string = leave the URL alone (Cloud SQL).
  clusterDomain: svc.cluster.local
