{{- /*
  Only rendered when the cluster knows the ServiceMonitor type (i.e. the
  Prometheus Operator / `make obs-up` is installed). Without this check,
  `make deploy` on a bare kind cluster would fail with "no matches for kind
  ServiceMonitor". `helm template` has no cluster, so lint/CI pass
  `--api-versions monitoring.coreos.com/v1/ServiceMonitor` to render it.
*/ -}}
{{- if and .Values.serviceMonitor.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/ServiceMonitor") }}
# ServiceMonitor (a Prometheus Operator custom resource): "Prometheus, please
# scrape every pod behind this Service on port `http`, path /metrics".
# The job label becomes the Service name - our SLO rules use job="call-router".
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "call-router.fullname" . }}
  labels:
    {{- include "call-router.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "call-router.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: {{ .Values.metrics.path }}
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
{{- end }}
