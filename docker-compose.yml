# Run the app locally with: docker compose up --build
services:
  call_router:
    # Build the image from app/Dockerfile.
    build:
      context: ./app
    image: voice-platform-ops/call_router:local
    # host:container - open http://localhost:4000
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      LOG_LEVEL: "info"
      # Calls are stored in the postgres service below (local-only password).
      DATABASE_URL: "ecto://call_router:call_router@postgres:5432/call_router"
    depends_on:
      postgres:
        condition: service_healthy
    # Restart automatically if the app crashes (not after manual stop).
    restart: unless-stopped
    # Give the BEAM time to shut down gracefully on SIGTERM.
    stop_grace_period: 20s
    # Defence in depth: read-only root FS, no extra Linux capabilities.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: call_router
      POSTGRES_PASSWORD: call_router # local dev only
      POSTGRES_DB: call_router
    healthcheck:
      # -h 127.0.0.1: TCP, so the temporary init-time server (socket only)
      # does not count as ready.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "call_router"]
      interval: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
