# =============================================================================
# GitHub Actions mirror of .gitlab-ci.yml - this one actually runs.
#
#   lint ─┐
#   test ─┴─> build ─> scan ─> deploy-kind (ephemeral cluster, smoke, rollback demo)
#                                   └─> publish (main only: GHCR push + cosign)
#
# Actions are pinned to full commit SHAs (tags can be moved by an attacker);
# the comment shows the human-readable version.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: jobs get read-only access unless they ask for more.
permissions:
  contents: read

# One run per branch/PR at a time; a new push to a PR cancels the old run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  OTP_VERSION: "27.3"
  ELIXIR_VERSION: "1.18.4"
  TERRAFORM_VERSION: "1.16.6"
  TFLINT_VERSION: "v0.64.0"
  HELM_VERSION: "v3.22.1"
  KUBECONFORM_VERSION: "v0.8.0"
  TRIVY_VERSION: "v0.76.0"
  KIND_VERSION: "v0.33.0"
  CNPG_CHART_VERSION: "0.29.1" # CloudNativePG operator 1.30.1
  PROMETHEUS_VERSION: "3.15.0" # only its `promtool` binary is used
  # prometheus-operator version bundled with kube-prometheus-stack 92.10.1;
  # we install just its ServiceMonitor CRD in the kind job (not the stack).
  PROM_OPERATOR_VERSION: "v0.94.1"
  # Community catalog of CRD JSON schemas, so kubeconform can validate
  # ServiceMonitor objects too (it only knows built-in kinds by default).
  CRD_SCHEMAS: "https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"
  IMAGE_REPO: voice-platform-ops/call_router # local name inside CI

jobs:
  # --------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      - name: Cache Mix deps and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            app/deps
            app/_build
          key: mix-lint-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('app/mix.lock') }}
          restore-keys: mix-lint-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-
      - name: Elixir format + credo
        working-directory: app
        run: |
          mix deps.get
          mix format --check-formatted
          mix credo --strict
      - name: Shellcheck scripts + chaos experiments
        run: shellcheck scripts/*.sh && shellcheck -x chaos/*.sh
      - name: Hadolint Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.14.0 < app/Dockerfile
      - name: Actionlint workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Terraform fmt + validate
        run: |
          terraform fmt -check -recursive infra/terraform
          for env in dev prod; do
            terraform -chdir=infra/terraform/envs/$env init -backend=false -input=false
            terraform -chdir=infra/terraform/envs/$env validate
          done
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - name: TFLint
        working-directory: infra/terraform
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids rate limits when downloading the plugin
        run: |
          tflint --init
          tflint --recursive --config "$PWD/.tflint.hcl"

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Helm lint + kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kubeconform
          helm lint deploy/helm/call-router -f deploy/helm/call-router/values-local.yaml
          helm lint deploy/helm/call-router-db -f deploy/helm/call-router-db/values-local.yaml
          for v in values-local.yaml values-ci.yaml; do
            echo "== call-router-db $v"
            helm template call-router-db deploy/helm/call-router-db -f "deploy/helm/call-router-db/$v" \
              --api-versions monitoring.coreos.com/v1/PodMonitor \
              | kubeconform -strict -summary -schema-location default -schema-location "$CRD_SCHEMAS" -
          done
          for v in values-local.yaml values-gke-dev.yaml values-gke-prod.yaml; do
            echo "== $v"
            helm template call-router deploy/helm/call-router -f "deploy/helm/call-router/$v" \
              --api-versions monitoring.coreos.com/v1/ServiceMonitor \
              | kubeconform -strict -summary -schema-location default -schema-location "$CRD_SCHEMAS" -
          done

  # --------------------------------------------------------------------------
  # SLO rules are code: syntax-check them and run their unit tests with
  # promtool (feeds fake time series in, asserts which alerts fire). Cheap -
  # no Prometheus server or cluster needed.
  slo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install promtool
        run: |
          curl -fsSL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin --strip-components=1 "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          promtool --version
      - name: promtool check rules
        run: promtool check rules slo/*.rules.yml
      - name: promtool test rules (SLO alert unit tests)
        run: promtool test rules slo/tests/*.test.yml
      - name: Render + schema-check the PrometheusRule wrapper
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kubeconform
          for f in slo/*.rules.yml; do
            scripts/slo-prometheusrule.sh "$f" \
              | kubeconform -strict -summary -schema-location default -schema-location "$CRD_SCHEMAS" -
          done

  # --------------------------------------------------------------------------
  test:
    runs-on: ubuntu-24.04
    # A throwaway PostgreSQL next to the job; tests run inside rolled-back
    # transactions (Ecto SQL sandbox), so the data never matters.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            app/deps
            app/_build
          key: mix-test-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('app/mix.lock') }}
          restore-keys: mix-test-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-
      - name: mix test
        working-directory: app
        env:
          MIX_ENV: test
          DATABASE_URL: ecto://postgres:postgres@localhost:5432/call_router_test
        run: |
          mix deps.get
          mix test

  # --------------------------------------------------------------------------
  build:
    needs: [lint, test, slo]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (tagged with commit SHA) to a tarball
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          tags: ${{ env.IMAGE_REPO }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # GitHub Actions cache backend for Docker layers.
          # The SHA changes the runtime apt-upgrade cache key so security
          # fixes published after the pinned Debian base are actually installed.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DEBIAN_SECURITY_REFRESH=${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
      # Artifacts pass files between jobs (each job is a fresh VM).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 3

  # --------------------------------------------------------------------------
  scan:
    needs: [build]
    runs-on: ubuntu-24.04
    env:
      # Fallback mirror if ghcr.io rate-limits the vulnerability DB download.
      TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true
      - name: Trivy image scan (fail on fixable HIGH/CRITICAL)
        run: trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --input "$RUNNER_TEMP/image.tar"
      - name: Trivy IaC scan (Terraform, Helm, Dockerfile)
        run: trivy config --exit-code 1 --severity HIGH,CRITICAL --skip-dirs app/deps,app/_build .
      - name: SBOM (CycloneDX)
        run: trivy image --format cyclonedx --output sbom.cdx.json --input "$RUNNER_TEMP/image.tar"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json

  # --------------------------------------------------------------------------
  # Real end-to-end deploy into a throwaway kind cluster on the runner.
  deploy-kind:
    needs: [scan]
    runs-on: ubuntu-24.04
    env:
      NAMESPACE: voice
      RELEASE: call-router
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Create kind cluster (1 control-plane + 2 workers)
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: ${{ env.KIND_VERSION }}
          config: kind/cluster.yaml
          cluster_name: voice-platform
          wait: 120s
      - name: Load image into the cluster nodes
        run: kind load image-archive "$RUNNER_TEMP/image.tar" --name voice-platform
      # values-local.yaml enables a ServiceMonitor (rendered only if the CRD
      # exists). Install just that CRD - a few KB, not the whole monitoring
      # stack - so the deploy really creates and validates the object.
      - name: Install the ServiceMonitor CRD only
        run: |
          kubectl apply --server-side -f "https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/${PROM_OPERATOR_VERSION}/example/prometheus-operator-crd/monitoring.coreos.com_servicemonitors.yaml"
          kubectl wait --for condition=established --timeout=60s crd/servicemonitors.monitoring.coreos.com
      # The app stores calls in PostgreSQL: install the CloudNativePG
      # operator and a single small instance (no backups in CI).
      - name: PostgreSQL (CloudNativePG, 1 instance)
        run: |
          helm repo add cnpg https://cloudnative-pg.github.io/charts
          helm upgrade --install cnpg cnpg/cloudnative-pg --version "$CNPG_CHART_VERSION" \
            -n cnpg-system --create-namespace -f deploy/database/cloudnative-pg.values.yaml \
            --set monitoring.podMonitorEnabled=false --set monitoring.grafanaDashboard.create=false \
            --wait --timeout 5m
          helm upgrade --install call-router-db deploy/helm/call-router-db -n "$NAMESPACE" --create-namespace \
            -f deploy/helm/call-router-db/values-ci.yaml --wait --timeout 5m
          kubectl -n "$NAMESPACE" wait --for=condition=Ready cluster/call-router-db --timeout=5m
      - name: Deploy (helm --atomic) + smoke test
        env:
          IMAGE_TAG: ${{ github.sha }}
          VALUES_FILES: deploy/helm/call-router/values-local.yaml
          SMOKE_URL: http://localhost:8080 # NodePort 30080 mapped by kind
          HELM_TIMEOUT: 3m
        run: scripts/deploy.sh
      - name: Rollback demo (broken readiness probe must be rolled back)
        env:
          IMAGE_TAG: ${{ github.sha }}
          VALUES_FILES: deploy/helm/call-router/values-local.yaml
          HELM_TIMEOUT: 60s
        run: scripts/rollback-demo.sh
      - name: Smoke test again after rollback
        run: BASE_URL=http://localhost:8080 scripts/ci-smoke.sh
      - name: Chaos smoke (delete a pod under load, max 1% errors, no lost calls)
        # Same script as the local chaos experiment 01, in its deterministic mode:
        # a normal pod delete (preStop + SIGTERM) must not drop requests or data.
        env:
          MODE: graceful
          DURATION: "40"
          WORKERS: "2"
          MAX_ERROR_PCT: "1"
        run: |
          rc=0
          chaos/01-pod-kill.sh || rc=$?
          cat chaos/results/01-pod-kill-graceful.md >> "$GITHUB_STEP_SUMMARY" || true
          exit "$rc"
      - name: Debug info on failure
        if: failure()
        run: |
          kubectl get nodes -o wide || true
          kubectl -n "$NAMESPACE" get all,events -o wide || true
          kubectl -n "$NAMESPACE" describe pods || true
          kubectl -n "$NAMESPACE" get cluster -o yaml || true
          kubectl -n "$NAMESPACE" logs -l app.kubernetes.io/instance="$RELEASE" --tail=100 || true
          helm -n "$NAMESPACE" history "$RELEASE" || true

  # --------------------------------------------------------------------------
  # Only on pushes to main: push to GitHub Container Registry and sign.
  publish:
    needs: [deploy-kind]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push to ghcr.io with the built-in GITHUB_TOKEN
      id-token: write # OIDC token for keyless cosign signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compute lowercase image name
        run: echo "GHCR_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/call_router" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (layers come from the gha cache)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ github.sha }}
            ${{ env.GHCR_IMAGE }}:main
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            DEBIAN_SECURITY_REFRESH=${{ github.sha }}
          cache-from: type=gha
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Keyless sign the image digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${GHCR_IMAGE}@${DIGEST}"
