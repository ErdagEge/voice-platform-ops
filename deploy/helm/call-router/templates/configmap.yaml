# A ConfigMap holds non-secret configuration. The Deployment loads every key
# below as an environment variable (envFrom), which config/runtime.exs reads.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "call-router.fullname" . }}
  labels:
    {{- include "call-router.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.config.port | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  # The Erlang VM sizes its port table from the open-file limit. Some
  # container runtimes set that limit to ~1 billion, which makes the VM
  # allocate huge tables at boot and get OOMKilled. Cap it explicitly.
  ERL_MAX_PORTS: {{ .Values.config.erlMaxPorts | quote }}
  DEPLOY_ENV: {{ .Values.config.environment | quote }}
  APP_VERSION: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
  FAULT_ERROR_RATE: {{ .Values.config.faultErrorRate | quote }}
  FAULT_LATENCY_MS: {{ .Values.config.faultLatencyMs | quote }}
  POOL_SIZE: {{ .Values.database.poolSize | quote }}
  {{- if and .Values.database.enabled .Values.database.clusterDomain }}
  # Turns "<service>.<namespace>" in DATABASE_URL into a cluster FQDN.
  DATABASE_CLUSTER_DOMAIN: {{ .Values.database.clusterDomain | quote }}
  {{- end }}
  {{- with .Values.tracing.otlpEndpoint }}
  # Where to send traces (OTLP over HTTP). Unset = tracing export off.
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ . | quote }}
  OTEL_SERVICE_NAME: call-router
  {{- end }}
