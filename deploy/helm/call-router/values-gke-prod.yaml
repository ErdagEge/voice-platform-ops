# Overrides for the GKE prod cluster (infra/terraform/envs/prod).
# image.repository / image.tag are set by CI (scripts/deploy.sh).
service:
  type: ClusterIP
config:
  logLevel: info
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi
podDisruptionBudget:
  enabled: true
  minAvailable: 2
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
# PostgreSQL on GKE = Cloud SQL (private IP, see docs/dr.md). The URL Secret
# is synced from Secret Manager (e.g. External Secrets Operator), never in git.
database:
  secretName: call-router-database
  secretKey: url
  # Private IP / Cloud SQL DNS name. Do not rewrite it to *.svc.cluster.local.
  clusterDomain: ""
